services:
  - type: web
    name: voxlens-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: GROQ_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
